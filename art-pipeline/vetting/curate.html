<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Elite Set Curation</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#1c1917; color:#e7e5e4;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  header { width:100%; box-sizing:border-box; padding:12px 20px; display:flex;
           justify-content:space-between; align-items:center; }
  h1 { font-size:16px; margin:0; color:#a8a29e; }
  #counts { font-size:14px; }
  .keep { color:#34d399; } .core { color:#fbbf24; } .drop { color:#f87171; } .undecided { color:#a8a29e; }
  #bar { width:100%; height:4px; background:#292524; }
  #bar div { height:100%; background:#34d399; width:0; }
  #name { font-size:28px; font-weight:700; margin:14px 0 4px; }
  #status { font-size:15px; font-weight:600; height:20px; }
  #box { background:#fafaf9; border-radius:14px; padding:10px; margin-top:8px;
         border:5px solid transparent; }
  #box.keep { border-color:#34d399; } #box.drop { border-color:#f87171; opacity:.55; }
  #img { max-width:min(78vw, 760px); max-height:62vh; display:block; }
  #keys { margin:16px 0 22px; color:#a8a29e; font-size:13px; display:flex; gap:20px;
          flex-wrap:wrap; justify-content:center; }
  kbd { background:#44403c; border-radius:5px; padding:2px 8px; color:#fafaf9; }
  #save { font-size:12px; color:#78716c; height:14px; }
</style>
</head>
<body>
<header>
  <h1>Superset pass · ★ CORE = your saved 36 · keep more to add to the superset</h1>
  <div id="counts"></div>
</header>
<div id="bar"><div></div></div>
<div id="name"></div>
<div id="status"></div>
<div id="box"><img id="img" alt=""></div>
<div id="keys">
  <span><kbd>K</kbd> or <kbd>↑</kbd> keep</span>
  <span><kbd>D</kbd> or <kbd>↓</kbd> drop</span>
  <span><kbd>←</kbd> <kbd>→</kbd> browse without deciding</span>
  <span><kbd>U</kbd> clear decision</span>
</div>
<div id="save"></div>
<script>
let slugs = [], picks = {}, i = 0, core = new Set();
const CORE_MODE = new URLSearchParams(location.search).get('set') === 'core';
const PICKS = CORE_MODE ? 'picks_core.json' : 'picks_masters.json';
const SAVE = CORE_MODE ? 'save_core' : 'save_masters';

async function boot() {
  const data = await (await fetch('candidates_masters.json')).json();
  slugs = Object.keys(data);
  try { picks = await (await fetch(PICKS, {cache:'no-store'})).json(); } catch (e) { picks = {}; }
  try { core = new Set((await (await fetch('elite_core_v1.json', {cache:'no-store'})).json()).keep); } catch (e) {}
  if (CORE_MODE) {
    slugs = slugs.filter(s => core.has(s));
    document.querySelector('h1').textContent = 'Core-only pass · your original 36 · fresh decisions (saved sets untouched)';
  }
  i = slugs.findIndex(s => !picks[s]); if (i < 0) i = 0;
  render();
}

function save() {
  const el = document.getElementById('save');
  fetch(SAVE, {method:'POST', headers:{'Content-Type':'application/json'},
                         body: JSON.stringify(picks)})
    .then(r => el.textContent = r.ok ? 'saved' : 'SAVE FAILED (' + r.status + ')')
    .catch(() => el.textContent = 'SAVE FAILED (server not reachable)');
}

function render() {
  const s = slugs[i], st = picks[s]?.status;
  const keep = Object.values(picks).filter(p => p.status === 'keep').length;
  const drop = Object.values(picks).filter(p => p.status === 'drop').length;
  document.getElementById('counts').innerHTML =
    `<span class="core">${[...core].filter(c => picks[c]?.status === 'keep').length} core</span> + ` +
    `<span class="keep">${keep - [...core].filter(c => picks[c]?.status === 'keep').length} added</span> = ${keep} keep · <span class="drop">${drop} drop</span> · ` +
    `<span class="undecided">${slugs.length - keep - drop} left</span> · #${i+1}/${slugs.length}`;
  document.querySelector('#bar div').style.width = ((keep + drop) / slugs.length * 100) + '%';
  document.getElementById('name').textContent = s.replace(/_/g, ' ');
  const stEl = document.getElementById('status');
  stEl.textContent = (core.has(s) ? '★ CORE · ' : '') + (st ? st.toUpperCase() : 'undecided');
  stEl.className = st || 'undecided';
  document.getElementById('box').className = st || '';
  document.getElementById('img').src = `master_thumbs/${s}.jpg`;
}

function decide(status) {
  picks[slugs[i]] = {status};
  save();
  if (i < slugs.length - 1) i++;
  render();
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'k' || e.key === 'ArrowUp') decide('keep');
  else if (k === 'd' || e.key === 'ArrowDown') decide('drop');
  else if (e.key === 'ArrowRight') { if (i < slugs.length - 1) i++; render(); }
  else if (e.key === 'ArrowLeft') { if (i > 0) i--; render(); }
  else if (k === 'u') { delete picks[slugs[i]]; save(); render(); }
  else return;
  e.preventDefault();
});
boot();
</script>
</body>
</html>
