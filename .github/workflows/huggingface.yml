name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Space only needs the API runtime. Pushing the whole repo fails:
      # HF rejects plain-git binary files (icons, PNG reports) since the
      # Xet/LFS policy, which is why every sync after Jan 2026 bounced.
      # Model weights are not in git at all - the Dockerfile downloads them
      # from the weights-v1 GitHub release at build time.
      - name: Assemble minimal Space tree
        run: |
          mkdir -p space
          cp --parents \
            README.md \
            Dockerfile \
            api/main.py \
            api/ai_engine.py \
            api/species_config.json \
            api/requirements.txt \
            frontend/public/parks.json \
            space/

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd space
          git init -b main
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "deploy ${GITHUB_SHA::9}"
          git push --force "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/raza44/aniML" main
